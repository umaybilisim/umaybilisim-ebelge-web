name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Inject deploy version into HTML
        run: |
          set -e
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TR_DATE=$(TZ='Europe/Istanbul' date +'%Y-%m-%d %H:%M:%S %:z')
          NEW_TAG="<!-- v: ${SHORT_SHA} | ${TR_DATE} -->"
          echo "Injecting: ${NEW_TAG}"

          find . -type f -name "*.html" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -print0 | xargs -0 sed -i -E "s#<!-- v: [a-f0-9]+ \| [^>]+ -->#${NEW_TAG}#g"

          echo "---"
          grep -m 1 "<!-- v:" index.html || echo "WARN: index.html'de versiyon yorumu bulunamadi"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=umaybilisim-ebelge-web

      - name: Notify IndexNow (changed pages)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          set +e
          FILES=$(git diff --name-only HEAD^ HEAD -- '*.html' | grep -v '^404.html$')
          [ -n "$FILES" ] || { echo "Degisen HTML yok, IndexNow atlandi"; exit 0; }
          URLS=()
          for f in $FILES; do
            [ -f "$f" ] || continue
            case "$f" in
              index.html) p="" ;;
              */index.html) p="${f%index.html}" ;;
              *.html) p="${f%.html}" ;;
            esac
            URLS+=("https://www.e-devlethizmetleri.com/$p")
          done
          sleep 45
          bash scripts/indexnow.sh "${URLS[@]}"
