name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject deploy version into HTML
        run: |
          set -e
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TR_DATE=$(TZ='Europe/Istanbul' date +'%Y-%m-%d %H:%M:%S %:z')
          NEW_TAG="<!-- v: ${SHORT_SHA} | ${TR_DATE} -->"
          echo "Injecting: ${NEW_TAG}"

          find . -type f -name "*.html" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -print0 | xargs -0 sed -i -E "s#<!-- v: [a-f0-9]+ \| [^>]+ -->#${NEW_TAG}#g"

          echo "---"
          grep -m 1 "<!-- v:" index.html || echo "WARN: index.html'de versiyon yorumu bulunamadi"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=umaybilisim-ebelge-web
