      - generic [ref=f84e196]:
        - heading "E-DÖNÜŞÜM’DE EDM FARKI!" [level=1] [ref=f84e197]
        - generic [ref=f84e198]:
          - generic [ref=f84e200]:
            - img "Sizin programınıza uyar!" [ref=f84e202]
            - generic [ref=f84e203]:
              - generic [ref=f84e204]: Sizin programınıza uyar!
              - paragraph [ref=f84e205]: 750+ ERP ve muhasebe programı ile anlaşmalı olan EDM ayrıcalığıyla ERP sistemi ve muhasebe programı içinden oluşturduğunuz faturalar, irsaliyeler, makbuzlar ve biletler otomatik olarak muhatabına gönderilir. Gelen faturalarınız ise ERP ve Muhasebe Programınızın cari ve stoklarına otomatik işlenerek müşavirinizin programına otomatik olarak aktarılır.
          - generic [ref=f84e207]:
            - img "Gerçek ücretlerle tanışın!" [ref=f84e209]
            - generic [ref=f84e210]:
              - generic [ref=f84e211]: Gerçek ücretlerle tanışın!
              - paragraph [ref=f84e212]: EDM, aylık sabit, yıllık sabit, güncelleme, kota aşımı gibi her ne ad altında olursa olsun etik olmayan aldatıcı ve gizli tarifeler uygulamaz! Kalan kontörünüz ay sonu ve yıl sonu gibi bahanelerle yanmaz, 5 yıl boyunca devreder. e-Fatura portal aktivasyonları ücretsizdir.
          - generic [ref=f84e214]:
            - img "Hızlı kurulum ve eğitim yerli yerinde!" [ref=f84e216]
            - generic [ref=f84e217]:
              - generic [ref=f84e218]: Hızlı kurulum ve eğitim yerli yerinde!
              - paragraph [ref=f84e219]: Siz, e-Dönüşüm için EDM ile çalışmaya karar verdikten sonra gereken tüm işlemler, EDM saha temsilciniz tarafından eksiksiz yerine getirilir. Kayıtlı Elektronik Posta (KEP) ve Elektronik İmza servisleri (e-imza) ve bu servislere dayalı verilen Elektronik Bordro, Ücret Pusulası ve Zaman Çizelgesi, Elektronik Mutabakat, Elektronik Tebligat, Elektronik İhtar hizmetleri için de tüm başvuru, aktivasyon, kurulum ve eğitim işlemleri EDM saha temsilciniz tarafından kendi yerinizde uygulanır.
          - generic [ref=f84e221]:
            - img "Verileriniz emin ellerde!" [ref=f84e223]
            - generic [ref=f84e224]:
              - generic [ref=f84e225]: Verileriniz emin ellerde!
              - paragraph [ref=f84e226]: e-Faturalarınız, e-İrsaliyeleriniz, e-Defterleriniz, e-Makbuzlarınız, e-Biletleriniz, bordrolarınız, ücret pusulalarınız, zaman çizelgeleriniz, tebligatlarınız, ihtarlarınız ve mutabakatlarınız EDM sistemlerinde 10 yıl boyunca 4 yedeklemeli ve 3DS şifreleme teknolojisiyle en güvenli şekilde saklanır. Faturalarınıza dilediğiniz an çevrimiçi erişebilir, tek tek ya da toplu olarak tekrar gönderme, görüntüleme ve PDF baskı alma gibi işlemleri yapabilirsiniz.
          - generic [ref=f84e228]:
            - img "İlgi 7/24 sizin üzerinizde!" [ref=f84e230]
            - generic [ref=f84e231]:
              - generic [ref=f84e232]: İlgi 7/24 sizin üzerinizde!
              - paragraph [ref=f84e233]: Türkiye’nin her ili ve ilçesinde sizlere özel atanan satış ve servis saha temsilciliğinin yanı sıra, EDM merkezde, 7/24 arayabileceğiniz bir asıl bir de yedek olmak üzere tüm e-Dönüşüm hizmetlerinde uzman müşteri temsilciniz bulunmaktadır. Dilediğiniz zaman temsilcilerinize cep telefonu ve e-Postayla ulaşarak anında hizmet alır, hatta gece ve resmi tatiller dahil, bu iletişim noktaları üzerinden teknik nöbet merkezimize otomatik aktarılırsınız.
          - generic [ref=f84e235]:
            - img "Rakipsiz, üstün özellikli, kullanıcıya dost!" [ref=f84e237]
            - generic [ref=f84e238]:
              - generic [ref=f84e239]: Rakipsiz, üstün özellikli, kullanıcıya dost!
              - paragraph [ref=f84e240]: EDM, Türkiye’nin tüm internet tarayıcıları ve yazılımlarıyla java bağımsız çalışabilen, Devlet Elektronik Yazışma Protokolü ile tam uyumlu olan ilk ve tek teknolojisine sahiptir. EDM hizmetleri; depo arşivi, süreç yönetimi, toplu fatura tekrarlama, tam metin arama, akıllı VKN kontrolü, tek platformdan tüm bağlı mükellefleri/servisleri yönetme, grup şirket ve şube yönetimi gibi yüzlerce yeteneği ile üstün özellikli ve kullanıcı dostudur.
