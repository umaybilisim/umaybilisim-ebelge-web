                - generic [ref=f36e62]:
                  - generic [ref=f36e63]:
                    - paragraph [ref=f36e64]: By enabling Cloudflare Email Address Obfuscation, email addresses on your web page will be hidden from bots, while keeping them visible to humans. In fact, there are no visible changes to your website for visitors.
                    - generic [ref=f36e65]:
                      - heading "Background" [level=2] [ref=f36e66]
                      - link [ref=f36e67] [cursor=pointer]:
                        - /url: "#background"
                        - img [ref=f36e69]
                    - paragraph [ref=f36e71]: Email harvesters and other bots roam the Internet looking for email addresses to add to lists that target recipients for spam. This trend results in an increasing amount of unwanted email.
                    - paragraph [ref=f36e72]:
                      - text: Web administrators have come up with clever ways to protect against this by writing out email addresses, such as
                      - code [ref=f36e73]: help [at] cloudflare [dot] com
                      - text: or by using embedded images of the email address. However, you lose the convenience of clicking on the email address to automatically send an email. By enabling Cloudflare Email Address Obfuscation, email addresses on your web page will be obfuscated (hidden) from bots, while keeping them visible to humans. In fact, there are no visible changes to your website for visitors.
                    - generic [ref=f36e74]:
                      - heading "How it works" [level=2] [ref=f36e75]
                      - link [ref=f36e76] [cursor=pointer]:
                        - /url: "#how-it-works"
                        - img [ref=f36e78]
                    - paragraph [ref=f36e80]:
                      - text: When Email Address Obfuscation is enabled, Cloudflare replaces visible email addresses in your HTML with links like
                      - code [ref=f36e81]: "[email protected]"
                      - text: . If a visitor sees this obfuscated format, they can click the link to reveal the actual email address. This approach prevents bots from scraping email addresses while keeping them accessible to real users.
                    - paragraph [ref=f36e82]:
                      - text: Cloudflare injects a small decode script (
                      - code [ref=f36e83]: email-decode.min.js
                      - text: ) into the page using the
                      - code [ref=f36e84]: defer
                      - text: attribute. This means the script does not block page rendering. It downloads in parallel with HTML parsing and executes after the document is fully parsed. If you have custom JavaScript that interacts with obfuscated email elements, note that the decode script runs before the
                      - code [ref=f36e85]: DOMContentLoaded
                      - text: event.
                    - generic [ref=f36e86]:
                      - heading "Change Email Address Obfuscation setting" [level=2] [ref=f36e87]
                      - link [ref=f36e88] [cursor=pointer]:
                        - /url: "#change-email-address-obfuscation-setting"
                        - img [ref=f36e90]
                    - paragraph [ref=f36e92]: Cloudflare enables email address obfuscation automatically when you sign up.
